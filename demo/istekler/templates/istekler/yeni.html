{% extends "istekler/base.html" %}
{% block baslik %}Yeni istek · Askıda İyilik{% endblock %}
{% block icerik %}
<form class="kutu" method="post">{% csrf_token %}
  <h2 style="margin:0 0 14px;font-size:19px">Yeni istek</h2>
  <label class="alan"><span>Kategori</span>
    <select class="girdi" name="kategori">{% for deger, ad in kategoriler %}<option value="{{ deger }}" {% if form.kategori == deger %}selected{% endif %}>{{ ad }}</option>{% endfor %}</select>
  </label>
  <label class="alan"><span>Başlık</span><input class="girdi" name="baslik" maxlength="120" required value="{{ form.baslik }}" placeholder="Kimya notları lazım"></label>
  <label class="alan"><span>Açıklama</span><textarea class="girdi" name="aciklama" maxlength="2000" required placeholder="Ne istediğini kısaca anlat.">{{ form.aciklama }}</textarea></label>
  <div class="bilgi">ⓘ Telefon, adres ya da başka kişisel bilgi yazma. İstekleri okuldaki herkes görür.</div>
  <button class="btn ana tam">Yayınla</button>
</form>
{% endblock %}
