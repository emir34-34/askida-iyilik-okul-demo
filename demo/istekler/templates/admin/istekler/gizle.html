{% extends "admin/base_site.html" %}
{% block content %}
<form method="post">{% csrf_token %}
  <p>Gizlenecek istekler (içerik silinmez, gerekçe durum geçmişine yazılır):</p>
  <ul>{% for i in istekler %}<li>{{ i.baslik }}<input type="hidden" name="_selected_action" value="{{ i.pk }}"></li>{% endfor %}</ul>
  <p><label>Gerekçe (zorunlu):<br><textarea name="gerekce" rows="3" cols="60" required></textarea></label></p>
  <input type="hidden" name="action" value="gizle">
  <input type="submit" name="uygula" value="Gizle">
</form>
{% endblock %}
