<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Askıda İyilik Ekran Taslakları</title>
<style>
  :root{--zemin:#f4f5f7;--kart:#fff;--metin:#1d1d1f;--soluk:#5f6b73;--cizgi:#e3e7ea;--vurgu:#c2410c;--cerceve:#1d1d1f}
  *{box-sizing:border-box}
  body{margin:0;background:#dfe3e7;color:var(--metin);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{max-width:1100px;margin:0 auto;padding:24px 16px 4px}
  header h1{margin:0 0 4px;font-size:22px}
  header p{margin:0;color:var(--soluk);max-width:720px}
  .galeri{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
  figure{margin:0;width:300px;max-width:100%}
  figcaption{font-weight:700;margin-bottom:8px}
  figcaption small{display:block;font-weight:400;color:var(--soluk)}
  .tel{height:560px;border:9px solid var(--cerceve);border-radius:30px;background:var(--zemin);overflow:hidden}
  .ust{background:var(--kart);border-bottom:1px solid var(--cizgi);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
  .ust b{font-size:15px}
  .ust .sag{margin-left:auto;color:var(--soluk)}
  .ic{padding:12px}
  .kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .kart h3{font-size:14px;margin:0 0 2px}
  .alt{color:var(--soluk);font-size:11.5px}
  .durum{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:4px}
  .acik{background:#e3f4e8;color:#17663a}.ustlenildi{background:#fff3d1;color:#7a5200}.yapildi{background:#e1ebfd;color:#1e4fa8}.tamamlandi{background:#eef0f2;color:#5f6b73}
  .btn{display:inline-block;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;background:#e8ebee}
  .btn.ana{background:var(--vurgu);color:#fff}
  .sekme{display:inline-block;padding:4px 10px;border-radius:999px;background:#e8ebee;font-size:12px;margin-right:4px}
  .sekme.s{background:var(--metin);color:#fff}
  .alan{border:1px solid var(--cizgi);border-radius:8px;background:#fff;padding:8px;font-size:13px;margin:3px 0 8px;color:var(--soluk)}
  .etk{font-size:12px;color:var(--soluk)}
  .not{background:#fff4ec;border-radius:8px;padding:8px;font-size:12px;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>Askıda İyilik · Ekran Taslakları</h1>
  <p><code>ekranlar.md</code>'deki beş ekranın görsel hâli. Akış: <b>sorunu bildir → biri üstlensin → yapıldı desin → bildiren onaylasın.</b> İsimler ve sorunlar uydurmadır.</p>
</header>
<main class="galeri">

<figure><figcaption>E1 · Giriş<small>Kayıt ol yok, hesapları yönetici açar</small></figcaption>
<div class="tel"><div class="ic" style="padding-top:110px">
  <div class="kart" style="padding:16px">
    <b style="font-size:17px">Giriş</b>
    <div class="alt" style="margin-bottom:8px">Okulda gördüğün sorunları bildir, birlikte çözelim.</div>
    <div class="etk">Kullanıcı adı</div><div class="alan">ogrenci4</div>
    <div class="etk">Şifre</div><div class="alan">••••••••</div>
    <div class="btn ana" style="display:block;text-align:center">Giriş yap</div>
  </div>
</div></div></figure>

<figure><figcaption>E2 · Sorunlar<small>Açık olanlar varsayılan, "Hepsi" tamamlananları da gösterir</small></figcaption>
<div class="tel"><div class="ust"><b>Askıda İyilik</b><span class="sag">Benim işlerim · Zeynep T.</span></div><div class="ic">
  <div style="display:flex;align-items:center;margin-bottom:8px"><b style="font-size:16px">Sorunlar</b><span class="btn ana" style="margin-left:auto">Sorun bildir</span></div>
  <div style="margin-bottom:8px"><span class="sekme s">Açık olanlar</span><span class="sekme">Hepsi</span></div>
  <div class="kart"><h3>2. kat lavabo musluğu damlıyor</h3><div class="alt">Zeynep T. · 2 saat önce</div><span class="durum acik">Açık</span></div>
  <div class="kart"><h3>Spor salonu kapısının kolu kırık</h3><div class="alt">Can B. · dün</div><span class="durum ustlenildi">Üstlenildi · Ayşe K.</span></div>
  <div class="kart"><h3>Kantin lavabosunda sabun bitti</h3><div class="alt">Mehmet A. · dün</div><span class="durum yapildi">Yapıldı · Elif S.</span></div>
</div></div></figure>

<figure><figcaption>E3 · Sorun bildir<small>Yalnızca okulda görülen sorunlar</small></figcaption>
<div class="tel"><div class="ust"><b>Askıda İyilik</b></div><div class="ic">
  <b style="font-size:16px">Sorun bildir</b>
  <div class="kart" style="margin-top:8px">
    <div class="etk">Ne sorunu var?</div><div class="alan">Spor salonu kapısının kolu kırık</div>
    <div class="etk">Nerede, nasıl?</div><div class="alan" style="height:70px">Giriş kapısının sağ kanadındaki kol yerinden çıkmış.</div>
    <div class="not">Yalnızca okulda gördüğün sorunları bildir: bozuk kapı, damlayan musluk, biten sabun gibi. Kişisel bilgi yazma.</div>
    <span class="btn ana">Bildir</span>
  </div>
</div></div></figure>

<figure><figcaption>E4 · Sorun sayfası<small>Düğmeler role ve duruma göre değişir</small></figcaption>
<div class="tel"><div class="ust"><b>Askıda İyilik</b><span class="sag">Ayşe K.</span></div><div class="ic">
  <div class="kart">
    <h3 style="font-size:16px">2. kat lavabo musluğu damlıyor</h3>
    <div class="alt">Zeynep T. bildirdi · 2 saat önce</div><span class="durum acik">Açık</span>
    <p style="font-size:13px;margin:8px 0">Kız tuvaletindeki soldan ikinci musluk sürekli damlıyor.</p>
    <span class="btn ana">Üstlen</span>
  </div>
  <div class="kart"><b style="font-size:13px">Yorumlar</b> <span class="alt">· herkese açık</span>
    <div style="border-top:1px solid var(--cizgi);margin-top:6px;padding-top:6px;font-size:13px"><div class="alt">Can B. · 1 saat önce</div>Bende de aynısını gördüm.</div>
    <div class="alan">Yorum yaz…</div><span class="btn">Gönder</span>
  </div>
  <div class="alt">Açık → diğerleri <b>Üstlen</b> · Üstlenildi → üstlenen <b>Yapıldı / Bırak</b> · Yapıldı → bildiren <b>Onayla</b></div>
</div></div></figure>

<figure><figcaption>E5 · Benim işlerim<small>Onay bekleyen işler öne çıkar</small></figcaption>
<div class="tel"><div class="ust"><b>Askıda İyilik</b><span class="sag">Mehmet A.</span></div><div class="ic">
  <b style="font-size:16px">Benim işlerim</b>
  <div style="margin:8px 0"><span class="sekme s">Bildirdiklerim</span><span class="sekme">Üstlendiklerim</span></div>
  <div class="kart"><h3>Kantin lavabosunda sabun bitti</h3><div class="alt">Mehmet A. · dün</div><span class="durum yapildi">Yapıldı · Elif S.</span></div>
  <div class="not" style="margin-top:-4px">Bu iş yapıldı, onayını bekliyor.</div>
  <div class="kart"><h3>Bahçedeki çöp kutusu taşıyor</h3><div class="alt">Mehmet A. · 3 gün önce</div><span class="durum tamamlandi">Tamamlandı · Can B.</span></div>
</div></div></figure>

</main>
</body>
</html>
